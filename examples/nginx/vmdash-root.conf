# vmdash on its own host name, at the default endpoint: https://vmdash.example.com/
#
# Install: copy to /etc/nginx/conf.d/vmdash.conf, change server_name and the certificate paths,
# then: nginx -t && systemctl reload nginx
# The app listens on 127.0.0.1:8080 (WEB_HOST / WEB_PORT in /etc/vmdash/vmdash.env) and asks for
# its own basic-auth login (WEB_USER / WEB_PASSWORD); nginx only adds TLS.

# Slows down password guessing: 5 requests/s per client, bursts of 20 (a page load is 3 requests,
# open pages poll every 30 s). Rejected requests get HTTP 429.
limit_req_zone $binary_remote_addr zone=vmdash_root:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name vmdash.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vmdash.example.com;

    ssl_certificate     /etc/nginx/tls/vmdash.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/vmdash.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;  # the dashboard only serves GET requests
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        limit_except GET { deny all; }  # GET includes HEAD
        limit_req zone=vmdash_root burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /healthz answers without a login. Uncomment to allow it only from your monitoring network.
    # location = /healthz {
    #     allow 10.0.0.0/8;
    #     deny all;
    #     limit_except GET { deny all; }
    #     proxy_pass http://127.0.0.1:8080;
    # }
}
