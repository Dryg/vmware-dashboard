# vmdash under a custom endpoint on a shared host name: https://intranet.example.com/vmdash/
#
# To add it to a server you already have, copy the two "location" blocks into that server and the
# limit_req_zone line next to it (outside any server block).
# To use another path, replace every "/vmdash" below (keep the trailing slashes as they are).
# The page uses relative links, so it needs no setting for the path prefix.
# The app listens on 127.0.0.1:8080 (WEB_HOST / WEB_PORT in /etc/vmdash/vmdash.env).

# Slows down password guessing: 5 requests/s per client, bursts of 20 (a page load is 3 requests,
# open pages poll every 30 s). Rejected requests get HTTP 429.
limit_req_zone $binary_remote_addr zone=vmdash_subpath:1m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name intranet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name intranet.example.com;

    ssl_certificate     /etc/nginx/tls/intranet.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/intranet.example.com.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16k;  # the dashboard only serves GET requests
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Relative links only resolve under the prefix when the URL ends with a slash.
    location = /vmdash {
        return 301 /vmdash/;
    }

    location /vmdash/ {
        # The trailing slash strips the prefix: /vmdash/status.json -> /status.json
        proxy_pass http://127.0.0.1:8080/;
        limit_except GET { deny all; }  # GET includes HEAD
        limit_req zone=vmdash_subpath burst=20 nodelay;
        limit_req_status 429;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /vmdash;
    }

    # Everything else on this host stays as it is, for example:
    # location / { root /var/www/intranet; }
}
